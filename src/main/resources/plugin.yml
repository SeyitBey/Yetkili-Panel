name: AdminPanel
version: '1.0.0-SNAPSHOT'
main: com.example.adminpanel.AdminPanelPlugin
api-version: '1.21'
author: AdminPanel Team
softdepend: [LuckPerms, Essentials, PlaceholderAPI]
commands:
  adminpanel:
    description: AdminPanel ana komutu
    aliases: [ap]
    permission: adminpanel.use
  report:
    description: Kural ihlali yapan oyunculari bildirir
    aliases: [sikayet]
permissions:
  adminpanel.use:
    description: Admin Panel acma yetkisi
    default: op
  adminpanel.reports.receive:
    description: Rapor bildirimlerini alma yetkisi
    default: op
  adminpanel.audit.view:
    description: Denetim kayitlarini goruntuleme yetkisi
    default: op
  adminpanel.profile.ip:
    description: Oyuncu IP adreslerini goruntuleme yetkisi
    default: op
  adminpanel.broadcast.staff:
    description: Yetkili duyurularini alma yetkisi
    default: op
  adminpanel.broadcast.server:
    description: Sunucu geneli duyuru yapma yetkisi
    default: op
